<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería y Subida de Fotos</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      .view {
        display: none;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .view.active {
        display: flex;
      }

      .container {
        max-width: 90%;
        max-height: 80vh;
      }
      img {
        max-width: 100%;
        max-height: 50vh;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        object-fit: contain;
        margin-bottom: 20px;
      }
      h2 {
        margin: 10px 0;
        font-size: 26px;
        letter-spacing: 1px;
      }
      .controls {
        margin-top: 20px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        text-align: left;
        border: 1px solid #333;
      }
      .card h2 { text-align: center; color: #fff; font-size: 22px; }
      .form-group { margin-bottom: 20px; }
      label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #ccc; }
      input[type="text"], input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: white;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
      }

      button {
        background-color: #1f1f1f;
        color: white;
        border: 1px solid #444;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }
      button:hover { background-color: #333; }
      button.primary { background-color: #4CAF50; border: none; }
      button.primary:hover { background-color: #43a047; }
      button.info { background-color: #0288D1; border: none; }
      button.info:hover { background-color: #0277BD; }
      button.accent { background-color: #E91E63; border: none; font-weight: bold; }
      button.accent:hover { background-color: #C2185B; }
      
      #status { margin-top: 15px; font-size: 14px; font-weight: 600; text-align: center; }
    </style>
  </head>
  <body>

    <!-- VISTA 1: SLIDESHOW -->
    <div id="vistaSlideshow" class="view active">
      <div class="container">
        <div id="contenido">
          <p id="mensaje" style="color: #888; font-style: italic;">Cargando galería...</p>
        </div>

        <div class="controls" id="botonesControles" style="display:none;">
          <button onclick="anterior()">❮ Anterior</button>
          <button id="btnAuto" class="primary" onclick="toggleAuto()">Pausar Auto-Play</button>
          <button onclick="siguiente()">Siguiente ❯</button>
          <button class="info" onclick="recargarDatos()">🔄 Actualizar</button>
          <button class="accent" onclick="cambiarVista('subir')">➕ Subir mi Foto</button>
        </div>
      </div>
    </div>

    <!-- VISTA 2: FORMULARIO -->
    <div id="vistaSubir" class="view">
      <div class="card">
        <h2>Sube tu Fotografía</h2>
        <p style="color: #888; font-size: 13px; margin-bottom: 20px; text-align: center;">Escribe tu nombre y elige tu foto.</p>
        
        <div class="form-group">
          <label for="nombreInput">Tu Nombre:</label>
          <input type="text" id="nombreInput" placeholder="Ej. María Pérez" required>
        </div>

        <div class="form-group">
          <label for="archivoInput">Seleccionar Foto:</label>
          <input type="file" id="archivoInput" accept="image/*" required>
        </div>

        <button class="primary" style="width:100%; padding: 12px; margin-bottom: 10px;" id="subirBtn" onclick="enviarFoto()">Subir y Ver Galería</button>
        <button style="width:100%; background: #444; border:none; padding: 10px;" onclick="cambiarVista('slideshow')">Volver al Slideshow</button>
        
        <div id="status"></div>
      </div>
    </div>

    <script>
      // Tu URL exacta de Google Apps Script
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBm1m4V3NWtdOOXElD9styluh501T0oLPK2n0Evrt0-He2EbyrSc9XIkXrgIjU7vb3MA/exec";

      let personas = [];
      let indiceActual = 0;
      let intervaloAuto = null;
      let estaReproduciendo = true;

      window.onload = function() {
        cargarDatos(true);
      };

      function cambiarVista(vista) {
        document.getElementById('vistaSlideshow').classList.remove('active');
        document.getElementById('vistaSubir').classList.remove('active');

        if (vista === 'slideshow') {
          document.getElementById('vistaSlideshow').classList.add('active');
          recargarDatos();
        } else if (vista === 'subir') {
          document.getElementById('vistaSubir').classList.add('active');
          document.getElementById('status').innerText = "";
          document.getElementById('nombreInput').value = "";
          document.getElementById('archivoInput').value = "";
        }
      }

      function cargarDatos(iniciarSlideshow) {
        fetch(SCRIPT_URL)
          .then(response => response.json())
          .then(data => {
            personas = data;
            if (personas.length === 0) {
              document.getElementById('contenido').innerHTML = `
                <p id="mensaje" style="color: #888; font-style: italic;">No hay fotos registradas todavía.</p>
                <button class="accent" onclick="cambiarVista('subir')" style="margin-top: 15px; padding: 12px 24px; font-size: 16px;">➕ Subir la primera foto</button>
              `;
              document.getElementById('botonesControles').style.display = 'flex';
            } else {
              document.getElementById('botonesControles').style.display = 'flex';
              if (indiceActual >= personas.length) indiceActual = 0;
              mostrarPersona();
              
              if (iniciarSlideshow) {
                iniciarAutoPlay();
              }
            }
          })
          .catch(error => {
            document.getElementById('mensaje').innerText = "Error al cargar los datos.";
            console.error(error);
          });
      }

      function mostrarPersona() {
        if (personas.length === 0) return;
        var p = personas[indiceActual];
        
        var urlFoto = p.foto;
        if (urlFoto && urlFoto.includes("googleusercontent.com/d/")) {
          var fileId = urlFoto.split("googleusercontent.com/d/")[1];
          if (fileId) {
            urlFoto = "https://drive.google.com/uc?export=view&id=" + fileId;
          }
        }
        
        var html = `
          <img src="${urlFoto}" alt="${p.nombre}">
          <h2>${p.nombre}</h2>
          <p style="color: #aaa; font-size: 14px;">(${indiceActual + 1} de ${personas.length})</p>
        `;
        document.getElementById('contenido').innerHTML = html;
      }

      function siguiente() {
        if (personas.length === 0) return;
        indiceActual = (indiceActual + 1) % personas.length;
        mostrarPersona();
      }

      function anterior() {
        if (personas.length === 0) return;
        indiceActual = (indiceActual - 1 + personas.length) % personas.length;
        mostrarPersona();
      }

      function iniciarAutoPlay() {
        if (intervaloAuto) clearInterval(intervaloAuto);
        intervaloAuto = setInterval(function() {
          if (estaReproduciendo) {
            siguiente();
          }
        }, 4000);
      }

      function toggleAuto() {
        estaReproduciendo = !estaReproduciendo;
        var btn = document.getElementById('btnAuto');
        if (estaReproduciendo) {
          btn.innerText = "Pausar Auto-Play";
          btn.classList.add('primary');
        } else {
          btn.innerText = "Reanudar Auto-Play";
          btn.classList.remove('primary');
        }
      }

      function recargarDatos() {
        cargarDatos(false);
      }

      function enviarFoto() {
        var nombre = document.getElementById('nombreInput').value.trim();
        var input = document.getElementById('archivoInput');
        var status = document.getElementById('status');
        var btn = document.getElementById('subirBtn');

        if (!nombre || input.files.length === 0) {
          status.style.color = "#E91E63";
          status.innerText = "Por favor completa todos los campos.";
          return;
        }

        var file = input.files[0];
        var reader = new FileReader();

        status.style.color = "#0288D1";
        status.innerText = "Subiendo archivo...";
        btn.disabled = true;

        reader.onload = function(e) {
          var rawData = e.target.result.split(',')[1];
          
          var payload = {
            nombre: nombre,
            filename: file.name,
            mimeType: file.type,
            data: rawData
          };

          fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(respuesta => {
            status.style.color = "#4CAF50";
            status.innerText = "¡Foto subida con éxito! Volviendo al slideshow...";
            btn.disabled = false;
            
            setTimeout(function() {
              cambiarVista('slideshow');
            }, 1200);
          })
          .catch(err => {
            status.style.color = "#E91E63";
            status.innerText = "Error al subir la imagen.";
            btn.disabled = false;
          });
        };

        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
