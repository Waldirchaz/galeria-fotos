<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería y Subida de Fotos</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* BOTÓN COMPACTO UNIFORME (MURO Y SLIDESHOW) */
      .btn-compact {
        padding: 5px 8px;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.2;
        border-radius: 6px;
        white-space: nowrap;
      }

      /* VISTA 1: MURO CON PORTADA SUPERIOR TIPO EVENTO */
      #vistaMuro {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 0 64px;
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .hero-portada {
        position: relative;
        width: 100%;
        max-width: 960px;
        min-height: 310px;
        background-color: #1c1b29;
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px 18px 26px;
        box-sizing: border-box;
        overflow: hidden;
      }
      @media (min-width: 640px) {
        .hero-portada {
          min-height: 360px;
          padding: 32px 28px 30px;
          border-bottom-left-radius: 14px;
          border-bottom-right-radius: 14px;
        }
      }
      .hero-portada::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(12, 12, 18, 0.25) 0%,
          rgba(12, 12, 18, 0.55) 55%,
          rgba(12, 12, 18, 0.88) 100%
        );
        z-index: 0;
      }
      .hero-contenido {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .hero-top-bar {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 2;
        display: flex;
        gap: 6px;
      }
      .hero-avatar {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
        background: #242424;
      }
      .hero-titulo {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
      }
      @media (min-width: 640px) {
        .hero-titulo {
          font-size: 34px;
        }
      }

      .muro-grid-wrapper {
        width: 100%;
        max-width: 960px;
        padding: 12px 10px 0;
        box-sizing: border-box;
      }
      @media (min-width: 640px) {
        .muro-grid-wrapper {
          padding: 18px 0 0;
        }
      }
      .muro-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      @media (min-width: 640px) {
        .muro-grid {
          gap: 12px;
        }
      }
      .muro-item {
        position: relative;
        aspect-ratio: 1 / 1;
        background: #1e1e1e;
        border-radius: 4px;
        overflow: hidden;
        cursor: pointer;
        border: 1px solid #2b2b2b;
        transition: transform 0.18s ease, border-color 0.18s ease;
      }
      @media (min-width: 640px) {
        .muro-item {
          border-radius: 8px;
        }
      }
      .muro-item:hover {
        transform: scale(1.015);
        border-color: #555;
      }
      .muro-item img,
      .muro-item video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .badge-video {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .badge-likes {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(18, 18, 22, 0.78);
        color: #ff6b8b;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        border: 1px solid rgba(255, 107, 139, 0.35);
      }
      .muro-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 18px 8px 6px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .muro-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
        font-size: 12px;
        color: #bbb;
        text-align: center;
      }

      /* BOTÓN PEQUEÑO PARA SUBIR RÁPIDO */
      .btn-subir-arriba {
        display: none;
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 40;
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 50%;
        font-size: 16px;
        font-weight: bold;
        line-height: 1;
        background-color: rgba(32, 32, 38, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
      }
      .btn-subir-arriba.visible {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* CAPAS SUPERPUESTAS SOBRE EL MURO (50% TRANSPARENCIA) */
      .overlay-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 60;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .overlay-modal.active {
        display: flex;
      }
      .overlay-modal.pseudo-fullscreen {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        z-index: 9999 !important;
        background-color: rgba(10, 10, 12, 0.96) !important;
        padding: 10px !important;
      }

      /* VISTA 2: SLIDESHOW SOBRE EL MURO */
      #vistaSlideshow {
        text-align: center;
      }
      .container {
        max-width: 96%;
        max-height: 94vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .slide-stage {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 290px;
        max-width: 100%;
        min-height: 220px;
        max-height: 72vh;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(18, 18, 22, 0.82);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
      }
      .btn-fullscreen-top {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 7;
        width: 30px;
        height: 30px;
        padding: 0;
        font-size: 14px;
        line-height: 1;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(24, 24, 28, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.25);
        opacity: 0.85;
      }
      .btn-fullscreen-top:hover {
        opacity: 1;
        background-color: rgba(42, 42, 48, 0.92);
      }
      .slide-img {
        max-width: 100%;
        max-height: 70vh;
        width: auto;
        height: auto;
        display: block;
        object-fit: contain;
      }
      .video-wrapper {
        position: relative;
        width: 82vw;
        min-width: 270px;
        max-width: 616px;
        padding: 10px 10px 70px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .video-stage-inner {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slide-video-el {
        width: 100%;
        max-height: 42vh;
        border-radius: 10px;
        background: #000;
        display: block;
      }
      .btn-center-play {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 6;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
        border-radius: 999px;
        background-color: rgba(24, 24, 28, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.35);
        opacity: 0.88;
      }
      .btn-center-play:hover {
        opacity: 1;
        background-color: rgba(42, 42, 48, 0.95);
      }
      .slide-video-frame {
        width: 100%;
        height: 250px;
        border: 0;
        border-radius: 10px;
        background: #000;
      }

      /* CONTROLES SOBRE LA FOTO (2 FILAS, MISMO TAMAÑO Y ESTILO, LIGERAMENTE TRANSPARENTES) */
      .controls-sobre-foto {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 8px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        max-width: calc(100% - 12px);
      }
      .controls-row {
        display: flex;
        gap: 5px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls-sobre-foto button {
        background-color: rgba(24, 24, 28, 0.72);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        opacity: 0.85;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      }
      .controls-sobre-foto button:hover,
      .controls-sobre-foto button:focus {
        background-color: rgba(42, 42, 48, 0.9);
        opacity: 1;
      }
      .controls-sobre-foto button.active-autoplay {
        background-color: rgba(76, 175, 80, 0.78);
        border-color: rgba(255, 255, 255, 0.35);
      }
      .controls-sobre-foto button.liked-btn {
        background-color: rgba(225, 29, 72, 0.82);
        border-color: rgba(255, 255, 255, 0.4);
      }

      h2 {
        margin: 10px 0 4px;
        font-size: 22px;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      }

      /* VISTA 3 Y 4: TARJETAS SOBRE EL MURO */
      .card {
        background: rgba(28, 28, 32, 0.94);
        padding: 28px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
        text-align: left;
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      .card h2 { text-align: center; color: #fff; font-size: 22px; text-shadow: none; }
      .form-group { margin-bottom: 18px; }
      label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #ddd; }
      input[type="text"], input[type="email"], input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #555;
        background: rgba(42, 42, 48, 0.95);
        color: white;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
      }
      .ayuda-multi {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: #bbb;
      }

      /* CHIPS DE DOMINIOS CONOCIDOS DE CORREO */
      .dominios-correo {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip-dominio {
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #ddd;
        cursor: pointer;
      }
      .chip-dominio:hover {
        background: rgba(76, 175, 80, 0.28);
        border-color: rgba(76, 175, 80, 0.6);
        color: #fff;
      }

      .progreso-box {
        display: none;
        margin-top: 14px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        overflow: hidden;
        height: 10px;
      }
      .progreso-barra {
        width: 0%;
        height: 100%;
        background: #4CAF50;
        transition: width 0.2s ease;
      }

      button {
        background-color: rgba(28, 28, 32, 0.82);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.24);
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s, transform 0.12s, opacity 0.2s;
      }
      button:hover { background-color: rgba(50, 50, 58, 0.94); }
      button.primary { background-color: rgba(76, 175, 80, 0.85); border: none; }
      button.primary:hover { background-color: rgba(67, 160, 71, 0.98); }
      button.info { background-color: rgba(2, 136, 209, 0.85); border: none; }
      button.info:hover { background-color: rgba(2, 119, 189, 0.98); }
      button.album-btn {
        background-color: rgba(24, 24, 27, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.26);
        color: #ffffff;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      button.album-btn:hover {
        background-color: rgba(39, 39, 44, 0.96);
      }

      #status, #statusZip {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      }
      .estado-muro {
        width: 100%;
        text-align: center;
        padding: 40px 16px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>

    <!-- VISTA 1: MURO INICIAL CON PORTADA SUPERIOR (SIEMPRE VISIBLE DE FONDO) -->
    <div id="vistaMuro">
      <div id="heroPortada" class="hero-portada">
        <div class="hero-top-bar">
          <button class="btn-compact" onclick="recargarDatos()">Actualizar</button>
          <button class="btn-compact" onclick="abrirModal('descargar')">Descargar todo</button>
        </div>

        <div class="hero-contenido">
          <img id="heroAvatar" class="hero-avatar" src="" alt="Foto de portada" style="display:none;" referrerpolicy="no-referrer" onerror="this.style.display='none';">
          <h1 id="heroTitulo" class="hero-titulo">Galería</h1>
          <button class="album-btn" onclick="abrirModal('subir')">➕ Añadir al álbum</button>
        </div>
      </div>

      <div class="muro-grid-wrapper">
        <div id="contenidoMuro" class="estado-muro">
          <p id="mensaje" style="color: #888; font-style: italic;">Cargando galería...</p>
        </div>
      </div>
    </div>

    <button id="btnSubirArriba" class="btn-subir-arriba" onclick="subirArriba()" title="Ir arriba">↑</button>

    <!-- VISTA 2: SLIDESHOW SOBRE EL MURO -->
    <div id="vistaSlideshow" class="overlay-modal" onclick="cerrarSiFondo(event, 'vistaSlideshow')">
      <div class="container">
        <div id="slideStage" class="slide-stage">
          <button id="btnFullscreen" class="btn-fullscreen-top" onclick="toggleFullscreenSlideshow()" title="Pantalla completa">⛶</button>
          <div id="contenidoSlide"></div>

          <div class="controls-sobre-foto" id="botonesControles">
            <div class="controls-row">
              <button class="btn-compact" onclick="anterior()">❮ Anterior</button>
              <button id="btnAuto" class="btn-compact" onclick="toggleAuto()">Iniciar Auto-Play</button>
              <button class="btn-compact" onclick="siguiente()">Siguiente ❯</button>
            </div>
            <div class="controls-row">
              <button class="btn-compact" onclick="cerrarModales()">🧱 Ver Muro</button>
              <button id="btnLikeSlide" class="btn-compact" onclick="toggleLikeActual()">♥ 0</button>
              <button class="btn-compact" onclick="descargarFotoActiva()">⬇ Descargar</button>
              <button class="btn-compact" onclick="abrirModal('subir')">➕ Añadir al álbum</button>
            </div>
          </div>
        </div>

        <div id="pieSlide"></div>
      </div>
    </div>

    <!-- VISTA 3: FORMULARIO DE SUBIDA SOBRE EL MURO -->
    <div id="vistaSubir" class="overlay-modal" onclick="cerrarSiFondo(event, 'vistaSubir')">
      <div class="card">
        <h2>Sube tu Fotografía o Video</h2>
        <p style="color: #bbb; font-size: 13px; margin-bottom: 20px; text-align: center;">Escribe tu nombre y elige una o varias fotos o videos.</p>
        
        <div class="form-group">
          <label for="nombreInput">Tu Nombre:</label>
          <input type="text" id="nombreInput" placeholder="Ej. María Pérez" required>
        </div>

        <div class="form-group">
          <label for="archivoInput">Seleccionar Foto(s) o Video(s):</label>
          <input type="file" id="archivoInput" accept="image/*,video/*" multiple required>
          <span class="ayuda-multi">Puedes seleccionar una o varias fotos o videos a la vez.</span>
        </div>

        <button class="primary" style="width:100%; padding: 12px; margin-bottom: 10px;" id="subirBtn" onclick="enviarFotos()">Subir y Ver Muro</button>
        <button style="width:100%; background: rgba(68, 68, 76, 0.9); border:none; padding: 10px;" onclick="cerrarModales()">Volver al Muro</button>
        
        <div id="progresoBox" class="progreso-box">
          <div id="progresoBarra" class="progreso-barra"></div>
        </div>
        <div id="status"></div>
      </div>
    </div>

    <!-- VISTA 4: VENTANA EMERGENTE PARA ENVIAR ZIP POR CORREO -->
    <div id="vistaDescargar" class="overlay-modal" onclick="cerrarSiFondo(event, 'vistaDescargar')">
      <div class="card">
        <h2>Descargar Álbum Completo</h2>
        <p style="color: #bbb; font-size: 13px; margin-bottom: 20px; text-align: center;">Generaremos el archivo .zip de la carpeta y te enviaremos el enlace de descarga por correo.</p>

        <div class="form-group">
          <label for="correoZipInput">Tu Correo Electrónico:</label>
          <input type="email" id="correoZipInput" placeholder="Ej. usuario@gmail.com" required>
          <div class="dominios-correo" aria-label="Terminaciones de correo frecuentes">
            <button type="button" class="chip-dominio" onclick="aplicarDominioCorreo('@gmail.com')">@gmail.com</button>
            <button type="button" class="chip-dominio" onclick="aplicarDominioCorreo('@hotmail.com')">@hotmail.com</button>
            <button type="button" class="chip-dominio" onclick="aplicarDominioCorreo('@outlook.com')">@outlook.com</button>
            <button type="button" class="chip-dominio" onclick="aplicarDominioCorreo('@yahoo.com')">@yahoo.com</button>
            <button type="button" class="chip-dominio" onclick="aplicarDominioCorreo('@icloud.com')">@icloud.com</button>
            <button type="button" class="chip-dominio" onclick="aplicarDominioCorreo('@live.com')">@live.com</button>
          </div>
        </div>

        <button class="primary" style="width:100%; padding: 12px; margin-bottom: 10px;" id="enviarZipBtn" onclick="solicitarZipPorCorreo()">Enviar enlace a mi correo</button>
        <button style="width:100%; background: rgba(68, 68, 76, 0.9); border:none; padding: 10px;" onclick="cerrarModales()">Cancelar</button>

        <div id="statusZip"></div>
      </div>
    </div>

    <script>
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7AXiZC4ux58UndrfTa8FVYIc8P9_oMWMKAbaEQU9ADaeuXXJzn2LgorRm07PqsYNayA/exec";
      const SHEET_ID = "1tgTEtJEJCwf57mrh04q4kC1tenLF-1KTjvpmDojLWRk";
      const INTERVALO_SLIDESHOW_MS = 7000;
      const STORAGE_LIKES_KEY = "galeria_likes_" + SHEET_ID;

      let personas = [];
      let likesMapa = cargarLikesGuardados();
      let carpetaDestinoE4 = "";
      let tituloActualGaleria = "Galería";
      let indiceActual = 0;
      let intervaloAuto = null;
      let estaReproduciendo = false;
      let timerCarga = null;

      window.onload = function() {
        cargarDatos();
        actualizarVisibilidadSubirArriba();
      };

      window.addEventListener("scroll", actualizarVisibilidadSubirArriba, { passive: true });

      function cargarLikesGuardados() {
        try {
          var raw = localStorage.getItem(STORAGE_LIKES_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      function guardarLikes() {
        try {
          localStorage.setItem(STORAGE_LIKES_KEY, JSON.stringify(likesMapa));
        } catch (e) {}
      }

      function obtenerClaveItem(item, idx) {
        if (!item) return "item_" + idx;
        return item.fileId || item.foto || ("item_" + idx);
      }

      function obtenerConteoLikes(item, idx) {
        var clave = obtenerClaveItem(item, idx);
        var entry = likesMapa[clave];
        if (!entry) return 0;
        if (typeof entry === "number") return entry;
        return entry.count || 0;
      }

      function usuarioDioLike(item, idx) {
        var clave = obtenerClaveItem(item, idx);
        var entry = likesMapa[clave];
        return !!(entry && typeof entry === "object" && entry.liked);
      }

      function actualizarBotonLikeSlide() {
        var btn = document.getElementById('btnLikeSlide');
        if (!btn || personas.length === 0) return;
        var p = personas[indiceActual];
        var total = obtenerConteoLikes(p, indiceActual);
        var liked = usuarioDioLike(p, indiceActual);
        btn.innerText = "♥ " + total;
        if (liked) {
          btn.classList.add('liked-btn');
        } else {
          btn.classList.remove('liked-btn');
        }
      }

      function toggleLikeActual() {
        if (personas.length === 0) return;
        var p = personas[indiceActual];
        var clave = obtenerClaveItem(p, indiceActual);
        var actual = likesMapa[clave];
        var count = (actual && typeof actual === "object") ? (actual.count || 0) : (typeof actual === "number" ? actual : 0);
        var liked = !!(actual && typeof actual === "object" && actual.liked);

        if (liked) {
          count = Math.max(0, count - 1);
          liked = false;
        } else {
          count = count + 1;
          liked = true;
        }

        likesMapa[clave] = { count: count, liked: liked };
        guardarLikes();
        actualizarBotonLikeSlide();
        renderizarMuro();

        fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            accion: "registrar_like",
            nombre: p.nombre,
            fileId: p.fileId || "",
            totalLikes: count
          })
        }).catch(function() {});
      }

      function salirFullscreenSiActivo() {
        var elem = document.getElementById('vistaSlideshow');
        if (elem) {
          elem.classList.remove('pseudo-fullscreen');

        if (document.fullscreenElement && document.exitFullscreen) {

        }

      function toggleFullscreenSlideshow() {
        var elem = document.getElementById('vistaSlideshow');
        if (!elem) return;

        var estaPseudo = elem.classList.contains('pseudo-fullscreen');
        var estaNativo = !!(document.fullscreenElement || document.webkitFullscreenElement);

        if (estaPseudo || estaNativo) {
          salirFullscreenSiActivo();
          return;
        }

        elem.classList.add('pseudo-fullscreen');

        var req = elem.requestFullscreen || elem.webkitRequestFullscreen;
        if (req) {
          try {
            var prom = req.call(elem);
            if (prom && typeof prom.catch === "function") {
              prom.catch(function() {});
            }
          } catch (e) {}
        }
      }

      function extraerIdDrive(url) {
        if (!url) return "";
        var limpio = String(url).trim();
        if (limpio.includes("/d/")) {
          return limpio.split("/d/")[1].split("/")[0].split("?")[0].trim();
        }
        if (limpio.includes("/folders/")) {
          return limpio.split("/folders/")[1].split("/")[0].split("?")[0].trim();
        }
        if (limpio.includes("id=")) {
          return limpio.split("id=")[1].split("&")[0].trim();
        }
        if (/^[a-zA-Z0-9_-]{15,}$/.test(limpio)) {
          return limpio;
        }
        return "";
      }

      function obtenerUrlImagen(fotoOriginal, ancho) {
        var sz = ancho || 1000;
        var fileId = extraerIdDrive(fotoOriginal);
        return fileId
          ? "https://drive.google.com/thumbnail?id=" + encodeURIComponent(fileId) + "&sz=w" + sz
          : fotoOriginal;
      }

      function obtenerUrlVideoDrive(fileId, fallbackUrl) {
        if (fileId) {
          return "https://drive.google.com/file/d/" + encodeURIComponent(fileId) + "/preview";
        }
        return fallbackUrl;
      }

      function esVideo(item) {
        if (!item) return false;
        var texto = ((item.nombre || "") + " " + (item.urlOriginal || "") + " " + (item.foto || "")).toLowerCase();
        return /\.(mp4|mov|webm|m4v|avi|3gp)(\?|$)/i.test(texto) || texto.includes("video") || texto.includes("/preview");
      }

      function escaparHtml(texto) {
        return String(texto || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function aplicarConfiguracionPortada(titulo, fondoRaw, avatarRaw) {
        tituloActualGaleria = (titulo && String(titulo).trim() !== "") ? String(titulo).trim() : "Galería";
        document.getElementById('heroTitulo').textContent = tituloActualGaleria;
        document.title = tituloActualGaleria;

        var heroEl = document.getElementById('heroPortada');
        if (fondoRaw && String(fondoRaw).trim() !== "") {
          var urlFondo = obtenerUrlImagen(fondoRaw, 1600);
          heroEl.style.backgroundImage = 'url("' + urlFondo.replace(/"/g, '%22') + '")';
        } else {
          heroEl.style.backgroundImage = "none";
        }

        var avatarEl = document.getElementById('heroAvatar');
        if (avatarRaw && String(avatarRaw).trim() !== "") {
          avatarEl.src = obtenerUrlImagen(avatarRaw, 500);
          avatarEl.alt = tituloActualGaleria;
          avatarEl.style.display = "block";
        } else {
          avatarEl.removeAttribute("src");
          avatarEl.style.display = "none";
        }
      }

      function obtenerValorCelda(filaObj, colIdx) {
        if (!filaObj || !Array.isArray(filaObj.c) || !filaObj.c[colIdx]) return "";
        var celda = filaObj.c[colIdx];
        if (celda.v === null || celda.v === undefined) return "";
        return String(celda.v).trim();
      }

      function renderizarMuro() {
        var contenedor = document.getElementById('contenidoMuro');

        if (personas.length === 0) {
          contenedor.className = "estado-muro";
          contenedor.innerHTML = `
            <p style="color: #888; font-style: italic;">No hay fotos ni videos registrados todavía.</p>
            <button class="album-btn" onclick="abrirModal('subir')" style="margin-top: 15px; padding: 12px 24px; font-size: 15px;">➕ Añadir al álbum</button>
          `;
          return;
        }

        contenedor.className = "muro-grid";
        var html = "";

        personas.forEach(function(p, idx) {
          var urlFoto = obtenerUrlImagen(p.foto, 800);
          var nombreSeguro = escaparHtml(p.nombre);
          var videoBadge = esVideo(p) ? `<span class="badge-video">▶ Video</span>` : "";
          var totalLikes = obtenerConteoLikes(p, idx);

          html += `
            <div class="muro-item" onclick="abrirSlideshowEnFoto(${idx})" title="Ver en slideshow: ${nombreSeguro}">
              <img src="${urlFoto}" alt="${nombreSeguro}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
              <div class="muro-fallback" style="display:none;">
                <span>${esVideo(p) ? "Video" : "Sin vista previa"}</span>
                <strong>${nombreSeguro}</strong>
              </div>
              <span class="badge-likes">♥ ${totalLikes}</span>
              ${videoBadge}
              <div class="muro-caption">${nombreSeguro}</div>
            </div>
          `;
        });

        contenedor.innerHTML = html;
      }

      window.recibirHojaGviz = function(resp) {
        if (timerCarga) {
          clearTimeout(timerCarga);
          timerCarga = null;
        }

        if (!resp || resp.status === "error" || !resp.table || !Array.isArray(resp.table.rows)) {
          mostrarErrorCarga("La hoja no devolvió datos válidos o no está compartida como 'Cualquier persona con el enlace'.");
          return;
        }

        var fila1 = resp.table.rows[0];
        var fila2 = resp.table.rows[1];
        var fila3 = resp.table.rows[2];
        var fila4 = resp.table.rows[3];

        var tituloE1 = obtenerValorCelda(fila1, 4);
        var fondoE2 = obtenerValorCelda(fila2, 4);
        var avatarE3 = obtenerValorCelda(fila3, 4);
        carpetaDestinoE4 = obtenerValorCelda(fila4, 4);

        aplicarConfiguracionPortada(tituloE1, fondoE2, avatarE3);

        var lista = [];
        resp.table.rows.forEach(function(filaObj, idx) {
          if (!filaObj || !Array.isArray(filaObj.c)) return;

          var nombre = obtenerValorCelda(filaObj, 0);
          var celdaB = obtenerValorCelda(filaObj, 1);
          var idB = extraerIdDrive(celdaB);

          var urlFoto = "";
          if (idB) {
            urlFoto = "https://drive.google.com/thumbnail?id=" + encodeURIComponent(idB) + "&sz=w1000";
          } else if (/^https?:\/\//i.test(celdaB)) {
            urlFoto = celdaB;
          }

          if (urlFoto !== "") {
            if (!nombre || nombre.startsWith("Date(")) {
              nombre = "Invitado " + (idx + 1);
            }
            lista.push({
              nombre: nombre,
              foto: urlFoto,
              urlOriginal: celdaB,
              fileId: idB
            });
          }
        });

        personas = lista;
        if (indiceActual >= personas.length) indiceActual = 0;

        if (document.getElementById('vistaSlideshow').classList.contains('active')) {
          mostrarPersona();
        } else {
          renderizarMuro();
        }
      };

      function cargarDatos() {
        var contenedor = document.getElementById('contenidoMuro');
        contenedor.className = "estado-muro";
        contenedor.innerHTML = `<p id="mensaje" style="color: #888; font-style: italic;">Cargando galería...</p>`;

        var scriptAnterior = document.getElementById('gvizScript');
        if (scriptAnterior) {
          scriptAnterior.remove();
        }

        if (timerCarga) {
          clearTimeout(timerCarga);
        }

        var script = document.createElement('script');
        script.id = 'gvizScript';
        script.src = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(SHEET_ID) + "/gviz/tq?gid=0&tqx=out:json;responseHandler:recibirHojaGviz&_=" + Date.now();
        script.onerror = function() {
          if (timerCarga) clearTimeout(timerCarga);
          mostrarErrorCarga("No se pudo conectar con Google Sheets.");
        };

        timerCarga = setTimeout(function() {
          mostrarErrorCarga("La conexión tardó demasiado en responder.");
        }, 12000);

        document.body.appendChild(script);
