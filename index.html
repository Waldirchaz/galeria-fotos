<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería y Subida de Fotos</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .view {
        display: none;
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .view.active {
        display: flex;
      }

      /* VISTA 1: MURO TIPO INSTAGRAM */
      #vistaMuro {
        flex-direction: column;
        align-items: center;
        padding: 20px 14px 40px;
      }
      .muro-header {
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid #2a2a2a;
      }
      .muro-header h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.5px;
      }
      .muro-acciones {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .muro-grid {
        width: 100%;
        max-width: 960px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      @media (min-width: 640px) {
        .muro-grid {
          gap: 14px;
        }
      }
      .muro-item {
        position: relative;
        aspect-ratio: 1 / 1;
        background: #1e1e1e;
        border-radius: 6px;
        overflow: hidden;
        cursor: pointer;
        border: 1px solid #2b2b2b;
        transition: transform 0.18s ease, border-color 0.18s ease;
      }
      .muro-item:hover {
        transform: scale(1.015);
        border-color: #555;
      }
      .muro-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .muro-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 18px 8px 6px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .muro-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
        font-size: 12px;
        color: #bbb;
        text-align: center;
      }

      /* VISTA 2: SLIDESHOW AL TOCAR UNA FOTO */
      #vistaSlideshow {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
      }
      .container {
        max-width: 92%;
        max-height: 85vh;
      }
      .slide-img {
        max-width: 100%;
        max-height: 55vh;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.65);
        object-fit: contain;
        margin-bottom: 16px;
      }
      h2 {
        margin: 8px 0;
        font-size: 24px;
        letter-spacing: 0.5px;
      }
      .controls {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* VISTA 3: FORMULARIO DE SUBIDA */
      #vistaSubir {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        background: #1e1e1e;
        padding: 28px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        text-align: left;
        border: 1px solid #333;
      }
      .card h2 { text-align: center; color: #fff; font-size: 22px; }
      .form-group { margin-bottom: 18px; }
      label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #ccc; }
      input[type="text"], input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: white;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
      }

      button {
        background-color: #1f1f1f;
        color: white;
        border: 1px solid #444;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }
      button:hover { background-color: #333; }
      button.primary { background-color: #4CAF50; border: none; }
      button.primary:hover { background-color: #43a047; }
      button.info { background-color: #0288D1; border: none; }
      button.info:hover { background-color: #0277BD; }
      button.accent { background-color: #E91E63; border: none; font-weight: bold; }
      button.accent:hover { background-color: #C2185B; }

      #status { margin-top: 15px; font-size: 14px; font-weight: 600; text-align: center; }
      .estado-muro {
        width: 100%;
        max-width: 960px;
        text-align: center;
        padding: 40px 16px;
      }
    </style>
  </head>
  <body>

    <!-- VISTA 1: MURO INICIAL TIPO INSTAGRAM -->
    <div id="vistaMuro" class="view active">
      <div class="muro-header">
        <h1>📸 Galería</h1>
        <div class="muro-acciones">
          <button class="info" onclick="recargarDatos()">🔄 Actualizar</button>
          <button class="accent" onclick="cambiarVista('subir')">➕ Subir mi Foto</button>
        </div>
      </div>

      <div id="contenidoMuro" class="estado-muro">
        <p id="mensaje" style="color: #888; font-style: italic;">Cargando galería...</p>
      </div>
    </div>

    <!-- VISTA 2: SLIDESHOW (SE ABRE AL DAR CLIC EN UNA FOTO) -->
    <div id="vistaSlideshow" class="view">
      <div class="container">
        <div id="contenidoSlide"></div>

        <div class="controls" id="botonesControles">
          <button onclick="cambiarVista('muro')">🧱 Ver Muro</button>
          <button onclick="anterior()">❮ Anterior</button>
          <button id="btnAuto" class="primary" onclick="toggleAuto()">Pausar Auto-Play</button>
          <button onclick="siguiente()">Siguiente ❯</button>
          <button class="accent" onclick="cambiarVista('subir')">➕ Subir mi Foto</button>
        </div>
      </div>
    </div>

    <!-- VISTA 3: FORMULARIO -->
    <div id="vistaSubir" class="view">
      <div class="card">
        <h2>Sube tu Fotografía</h2>
        <p style="color: #888; font-size: 13px; margin-bottom: 20px; text-align: center;">Escribe tu nombre y elige tu foto.</p>
        
        <div class="form-group">
          <label for="nombreInput">Tu Nombre:</label>
          <input type="text" id="nombreInput" placeholder="Ej. María Pérez" required>
        </div>

        <div class="form-group">
          <label for="archivoInput">Seleccionar Foto:</label>
          <input type="file" id="archivoInput" accept="image/*" required>
        </div>

        <button class="primary" style="width:100%; padding: 12px; margin-bottom: 10px;" id="subirBtn" onclick="enviarFoto()">Subir y Ver Muro</button>
        <button style="width:100%; background: #444; border:none; padding: 10px;" onclick="cambiarVista('muro')">Volver al Muro</button>
        
        <div id="status"></div>
      </div>
    </div>

      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7AXiZC4ux58UndrfTa8FVYIc8P9_oMWMKAbaEQU9ADaeuXXJzn2LgorRm07PqsYNayA/exec";
      const SHEET_ID = "1tgTEtJEJCwf57mrh04q4kC1tenLF-1KTjvpmDo
