<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería y Subida de Fotos</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .view {
        display: none;
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .view.active {
        display: flex;
      }

      /* VISTA 1: MURO CON PORTADA SUPERIOR TIPO EVENTO */
      #vistaMuro {
        flex-direction: column;
        align-items: center;
        padding: 0 0 44px;
      }

      .hero-portada {
        position: relative;
        width: 100%;
        max-width: 960px;
        min-height: 310px;
        background-color: #1c1b29;
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px 18px 26px;
        box-sizing: border-box;
        overflow: hidden;
      }
      @media (min-width: 640px) {
        .hero-portada {
          min-height: 360px;
          padding: 32px 28px 30px;
          border-bottom-left-radius: 14px;
          border-bottom-right-radius: 14px;
        }
      }
      .hero-portada::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(12, 12, 18, 0.25) 0%,
          rgba(12, 12, 18, 0.55) 55%,
          rgba(12, 12, 18, 0.88) 100%
        );
        z-Index: 0;
      }
      .hero-contenido {
        position: relative;
        z-Index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .hero-top-bar {
        position: absolute;
        top: 14px;
        right: 14px;
        z-Index: 2;
        display: flex;
        gap: 8px;
      }
      .hero-avatar {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
        background: #242424;
      }
      .hero-titulo {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
      }
      @media (min-width: 640px) {
        .hero-titulo {
          font-size: 34px;
        }
      }

      .muro-grid-wrapper {
        width: 100%;
        max-width: 960px;
        padding: 12px 10px 0;
        box-sizing: border-box;
      }
      @media (min-width: 640px) {
        .muro-grid-wrapper {
          padding: 18px 0 0;
        }
      }
      .muro-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      @media (min-width: 640px) {
        .muro-grid {
          gap: 12px;
        }
      }
      .muro-item {
        position: relative;
        aspect-ratio: 1 / 1;
        background: #1e1e1e;
        border-radius: 4px;
        overflow: hidden;
        cursor: pointer;
        border: 1px solid #2b2b2b;
        transition: transform 0.18s ease, border-color 0.18s ease;
      }
      @media (min-width: 640px) {
        .muro-item {
          border-radius: 8px;
        }
      }
      .muro-item:hover {
        transform: scale(1.015);
        border-color: #555;
      }
      .muro-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .muro-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 18px 8px 6px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .muro-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
        font-size: 12px;
        color: #bbb;
        text-align: center;
      }

      /* VISTA 2: SLIDESHOW (FONDO NEGRO CON 50% DE TRANSPARENCIA) */
      #vistaSlideshow {
        position: fixed;
        inset: 0;
        z-Index: 50;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
      }
      .container {
        max-width: 92%;
        max-height: 88vh;
      }
      .slide-img {
        max-width: 100%;
        max-height: 55vh;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
        object-fit: contain;
        margin-bottom: 16px;
      }
      h2 {
        margin: 8px 0;
        font-size: 24px;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      .controls {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* VISTA 3: FORMULARIO DE SUBIDA */
      #vistaSubir {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        background: #1e1e1e;
        padding: 28px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        text-align: left;
        border: 1px solid #333;
      }
      .card h2 { text-align: center; color: #fff; font-size: 22px; text-shadow: none; }
      .form-group { margin-bottom: 18px; }
      label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #ccc; }
      input[type="text"], input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: white;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
      }

      button {
        background-color: rgba(31, 31, 31, 0.92);
        color: white;
        border: 1px solid #444;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s, transform 0.12s;
      }
      button:hover { background-color: #333; }
      button.primary { background-color: #4CAF50; border: none; }
      button.primary:hover { background-color: #43a047; }
      button.info { background-color: rgba(2, 136, 209, 0.92); border: none; }
      button.info:hover { background-color: #0277BD; }
      button.album-btn {
        background-color: rgba(24, 24, 27, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #ffffff;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      button.album-btn:hover {
        background-color: rgba(39, 39, 44, 0.98);
      }

      #status { margin-top: 15px; font-size: 14px; font-weight: 600; text-align: center; }
      .estado-muro {
        width: 100%;
        text-align: center;
        padding: 40px 16px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>

    <!-- VISTA 1: MURO INICIAL CON PORTADA SUPERIOR -->
    <div id="vistaMuro" class="view active">
      <div id="heroPortada" class="hero-portada">
        <div class="hero-top-bar">
          <button class="info" onclick="recargarDatos()" title="Actualizar galería">🔄</button>
        </div>

        <div class="hero-contenido">
          <img id="heroAvatar" class="hero-avatar" src="" alt="Foto de portada" style="display:none;" referrerpolicy="no-referrer" onerror="this.style.display='none';">
          <h1 id="heroTitulo" class="hero-titulo">Galería</h1>
          <button class="album-btn" onclick="cambiarVista('subir')">➕ Añadir al álbum</button>
        </div>
      </div>

      <div class="muro-grid-wrapper">
        <div id="contenidoMuro" class="estado-muro">
          <p id="mensaje" style="color: #888; font-style: italic;">Cargando galería...</p>
        </div>
      </div>
    </div>

    <!-- VISTA 2: SLIDESHOW (SE ABRE AL DAR CLIC EN UNA FOTO) -->
    <div id="vistaSlideshow" class="view">
      <div class="container">
        <div id="contenidoSlide"></div>

        <div class="controls" id="botonesControles">
          <button onclick="cambiarVista('muro')">🧱 Ver Muro</button>
          <button onclick="anterior()">❮ Anterior</button>
          <button id="btnAuto" onclick="toggleAuto()">Iniciar Auto-Play</button>
          <button onclick="siguiente()">Siguiente ❯</button>
          <button class="info" onclick="descargarFotoActiva()">⬇ Descargar</button>
          <button class="album-btn" onclick="cambiarVista('subir')">➕ Añadir al álbum</button>
        </div>
      </div>
    </div>

    <!-- VISTA 3: FORMULARIO -->
    <div id="vistaSubir" class="view">
      <div class="card">
        <h2>Sube tu Fotografía</h2>
        <p style="color: #888; font-size: 13px; margin-bottom: 20px; text-align: center;">Escribe tu nombre y elige tu foto.</p>
        
        <div class="form-group">
          <label for="nombreInput">Tu Nombre:</label>
          <input type="text" id="nombreInput" placeholder="Ej. María Pérez" required>
        </div>

        <div class="form-group">
          <label for="archivoInput">Seleccionar Foto:</label>
          <input type="file" id="archivoInput" accept="image/*" required>
        </div>

        <button class="primary" style="width:100%; padding: 12px; margin-bottom: 10px;" id="subirBtn" onclick="enviarFoto()">Subir y Ver Muro</button>
        <button style="width:100%; background: #444; border:none; padding: 10px;" onclick="cambiarVista('muro')">Volver al Muro</button>
        
        <div id="status"></div>
      </div>
    </div>

    <script>
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7AXiZC4ux58UndrfTa8FVYIc8P9_oMWMKAbaEQU9ADaeuXXJzn2LgorRm07PqsYNayA/exec";
      const SHEET_ID = "1tgTEtJEJCwf57mrh04q4kC1tenLF-1KTjvpmDojLWRk";
      const INTERVALO_SLIDESHOW_MS = 7000; // 7 segundos (1 segundo más lento que antes)

      let personas = [];
      let indiceActual = 0;
      let intervaloAuto = null;
      let estaReproduciendo = false; // Inicia apagado hasta pulsar Iniciar Auto-Play
      let timerCarga = null;

      window.onload = function() {
        cargarDatos();
      };

      function detenerAutoPlay() {
        estaReproduciendo = false;
        actualizarBotonAuto();
        if (intervaloAuto) {
          clearInterval(intervaloAuto);
          intervaloAuto = null;
        }
      }

      function iniciarAutoPlay() {
        if (intervaloAuto) {
          clearInterval(intervaloAuto);
        }
        estaReproduciendo = true;
        actualizarBotonAuto();
        intervaloAuto = setInterval(function() {
          if (estaReproduciendo && document.getElementById('vistaSlideshow').classList.contains('active')) {
            siguiente();
          }
        }, INTERVALO_SLIDESHOW_MS);
      }

      function actualizarBotonAuto() {
        var btn = document.getElementById('btnAuto');
        if (!btn) return;
        if (estaReproduciendo) {
          btn.innerText = "Pausar Auto-Play";
          btn.classList.add('primary');
        } else {
          btn.innerText = "Iniciar Auto-Play";
          btn.classList.remove('primary');
        }
      }

      function cambiarVista(vista) {
        document.getElementById('vistaMuro').classList.remove('active');
        document.getElementById('vistaSlideshow').classList.remove('active');
        document.getElementById('vistaSubir').classList.remove('active');

        if (vista === 'muro') {
          detenerAutoPlay();
          document.getElementById('vistaMuro').classList.add('active');
          renderizarMuro();
        } else if (vista === 'slideshow') {
          detenerAutoPlay(); // Se abre sin auto-play hasta que el usuario lo inicie
          document.getElementById('vistaSlideshow').classList.add('active');
          mostrarPersona();
        } else if (vista === 'subir') {
          detenerAutoPlay();
          document.getElementById('vistaSubir').classList.add('active');
          document.getElementById('status').innerText = "";
          document.getElementById('nombreInput').value = "";
          document.getElementById('archivoInput').value = "";
        }
      }

      function abrirSlideshowEnFoto(indice) {
        if (indice < 0 || indice >= personas.length) return;
        indiceActual = indice;
        cambiarVista('slideshow');
      }

      function extraerIdDrive(url) {
        if (!url) return "";
        var limpio = String(url).trim();
        if (limpio.includes("/d/")) {
          return limpio.split("/d/")[1].split("/")[0].split("?")[0].trim();
        }
        if (limpio.includes("id=")) {
          return limpio.split("id=")[1].split("&")[0].trim();
        }
        if (/^[a-zA-Z0-9_-]{20,}$/.test(limpio)) {
          return limpio;
        }
        return "";
      }

      function obtenerUrlImagen(fotoOriginal, ancho) {
        var sz = ancho || 1000;
        var fileId = extraerIdDrive(fotoOriginal);
        return fileId
          ? "https://drive.google.com/thumbnail?id=" + encodeURIComponent(fileId) + "&sz=w" + sz
          : fotoOriginal;
      }

      function escaparHtml(texto) {
        return String(texto || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function aplicarConfiguracionPortada(titulo, fondoRaw, avatarRaw) {
        var tituloFinal = (titulo && String(titulo).trim() !== "") ? String(titulo).trim() : "Galería";
        document.getElementById('heroTitulo').textContent = tituloFinal;
        document.title = tituloFinal;

        var heroEl = document.getElementById('heroPortada');
        if (fondoRaw && String(fondoRaw).trim() !== "") {
          var urlFondo = obtenerUrlImagen(fondoRaw, 1600);
          heroEl.style.backgroundImage = 'url("' + urlFondo.replace(/"/g, '%22') + '")';
        } else {
          heroEl.style.backgroundImage = "none";
        }

        var avatarEl = document.getElementById('heroAvatar');
        if (avatarRaw && String(avatarRaw).trim() !== "") {
          avatarEl.src = obtenerUrlImagen(avatarRaw, 500);
          avatarEl.alt = tituloFinal;
          avatarEl.style.display = "block";
        } else {
          avatarEl.removeAttribute("src");
          avatarEl.style.display = "none";
        }
      }

      function obtenerValorCelda(filaObj, colIdx) {
        if (!filaObj || !Array.isArray(filaObj.c) || !filaObj.c[colIdx]) return "";
        var celda = filaObj.c[colIdx];
        if (celda.v === null || celda.v === undefined) return "";
        return String(celda.v).trim();
      }

      function renderizarMuro() {
        var contenedor = document.getElementById('contenidoMuro');

        if (personas.length === 0) {
          contenedor.className = "estado-muro";
          contenedor.innerHTML = `
            <p style="color: #888; font-style: italic;">No hay fotos registradas todavía.</p>
            <button class="album-btn" onclick="cambiarVista('subir')" style="margin-top: 15px; padding: 12px 24px; font-size: 15px;">➕ Añadir la primera foto</button>
          `;
          return;
        }

        contenedor.className = "muro-grid";
        var html = "";

        personas.forEach(function(p, idx) {
          var urlFoto = obtenerUrlImagen(p.foto, 800);
          var nombreSeguro = escaparHtml(p.nombre);
          html += `
            <div class="muro-item" onclick="abrirSlideshowEnFoto(${idx})" title="Ver en slideshow: ${nombreSeguro}">
              <img src="${urlFoto}" alt="${nombreSeguro}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
              <div class="muro-fallback" style="display:none;">
                <span>Sin vista previa</span>
                <strong>${nombreSeguro}</strong>
              </div>
              <div class="muro-caption">${nombreSeguro}</div>
            </div>
          `;
        });

        contenedor.innerHTML = html;
      }

      window.recibirHojaGviz = function(resp) {
        if (timerCarga) {
          clearTimeout(timerCarga);
          timerCarga = null;
        }

        if (!resp || resp.status === "error" || !resp.table || !Array.isArray(resp.table.rows)) {
          mostrarErrorCarga("La hoja no devolvió datos válidos o no está compartida como 'Cualquier persona con el enlace'.");
          return;
        }

        // Portada: Columna E (índice 4) -> Fila 1 = E1, Fila 2 = E2, Fila 3 = E3
        var fila1 = resp.table.rows[0];
        var fila2 = resp.table.rows[1];
        var fila3 = resp.table.rows[2];

        var tituloE1 = obtenerValorCelda(fila1, 4);
        var fondoE2 = obtenerValorCelda(fila2, 4);
        var avatarE3 = obtenerValorCelda(fila3, 4);

        aplicarConfiguracionPortada(tituloE1, fondoE2, avatarE3);

        // Galería: Nombre en Columna A (índice 0) y Foto en Columna B (índice 1)
        var lista = [];
        resp.table.rows.forEach(function(filaObj, idx) {
          if (!filaObj || !Array.isArray(filaObj.c)) return;

          var nombre = obtenerValorCelda(filaObj, 0);
          var celdaB = obtenerValorCelda(filaObj, 1);
          var idB = extraerIdDrive(celdaB);

          var urlFoto = "";
          if (idB) {
            urlFoto = "https://drive.google.com/thumbnail?id=" + encodeURIComponent(idB) + "&sz=w1000";
          } else if (/^https?:\/\//i.test(celdaB)) {
            urlFoto = celdaB;
          }

          if (urlFoto !== "") {
            if (!nombre || nombre.startsWith("Date(")) {
              nombre = "Invitado " + (idx + 1);
            }
            lista.push({
              nombre: nombre,
              foto: urlFoto,
              fileId: idB
            });
          }
        });

        personas = lista;
        if (indiceActual >= personas.length) indiceActual = 0;

        if (document.getElementById('vistaSlideshow').classList.contains('active')) {
          mostrarPersona();
        } else {
          renderizarMuro();
        }
      };

      function cargarDatos() {
        var contenedor = document.getElementById('contenidoMuro');
        contenedor.className = "estado-muro";
        contenedor.innerHTML = `<p id="mensaje" style="color: #888; font-style: italic;">Cargando galería...</p>`;

        var scriptAnterior = document.getElementById('gvizScript');
        if (scriptAnterior) {
          scriptAnterior.remove();
        }

        if (timerCarga) {
          clearTimeout(timerCarga);
        }

        var script = document.createElement('script');
        script.id = 'gvizScript';
        script.src = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(SHEET_ID) + "/gviz/tq?gid=0&tqx=out:json;responseHandler:recibirHojaGviz&_=" + Date.now();
        script.onerror = function() {
          if (timerCarga) clearTimeout(timerCarga);
          mostrarErrorCarga("No se pudo conectar con Google Sheets.");
        };

        timerCarga = setTimeout(function() {
          mostrarErrorCarga("La conexión tardó demasiado en responder.");
        }, 12000);

        document.body.appendChild(script);
      }

      function mostrarErrorCarga(detalle) {
        var contenedor = document.getElementById('contenidoMuro');
        contenedor.className = "estado-muro";
        contenedor.innerHTML = `
          <p style="color: #ff6b6b;">No se pudieron cargar los datos (${detalle}).</p>
          <button class="info" onclick="recargarDatos()" style="margin-top: 12px;">🔄 Reintentar</button>
          <button class="album-btn" onclick="cambiarVista('subir')" style="margin-top: 12px;">➕ Añadir al álbum</button>
        `;
      }

      function mostrarPersona() {
        if (personas.length === 0) return;
        var p = personas[indiceActual];
        var urlFoto = obtenerUrlImagen(p.foto, 1200);
        var nombreSeguro = escaparHtml(p.nombre);

        var html = `
          <img class="slide-img" src="${urlFoto}" alt="${nombreSeguro}" referrerpolicy="no-referrer" onerror="this.style.display='none'; document.getElementById('avisoImg').style.display='block';">
          <p id="avisoImg" style="display:none; color:#ff9800; font-size:14px;">No se pudo mostrar la imagen de ${nombreSeguro}.</p>
          <h2>${nombreSeguro}</h2>
          <p style="color: #ddd; font-size: 14px;">(${indiceActual + 1} de ${personas.length})</p>
        `;
        document.getElementById('contenidoSlide').innerHTML = html;
      }

      function descargarFotoActiva() {
        if (personas.length === 0) return;
        var p = personas[indiceActual];
        var fileId = p.fileId || extraerIdDrive(p.foto);
        var urlDescarga = fileId
          ? "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(fileId)
          : p.foto;

        var nombreArchivo = (p.nombre || "foto")
          .toLowerCase()
          .replace(/[^a-z0-9-_]+/g, "_")
          .replace(/^_+|_+$/g, "") || "foto";

        var enlace = document.createElement('a');
        enlace.href = urlDescarga;
        enlace.download = nombreArchivo + ".jpg";
        enlace.target = "_blank";
        enlace.rel = "noopener";
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();
      }

      function siguiente() {
        if (personas.length === 0) return;
        indiceActual = (indiceActual + 1) % personas.length;
        mostrarPersona();
      }

      function anterior() {
        if (personas.length === 0) return;
        indiceActual = (indiceActual - 1 + personas.length) % personas.length;
        mostrarPersona();
      }

      function toggleAuto() {
        if (estaReproduciendo) {
          detenerAutoPlay();
        } else {
          iniciarAutoPlay();
        }
      }

      function recargarDatos() {
        cargarDatos();
      }

      function prepararImagenParaEnvio(file, callback) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var maxLado = 1400;
            var ancho = img.width;
            var alto = img.height;

            if (ancho > maxLado || alto > maxLado) {
              if (ancho >= alto) {
                alto = Math.round((alto * maxLado) / ancho);
                ancho = maxLado;
              } else {
                ancho = Math.round((ancho * maxLado) / alto);
                alto = maxLado;
              }
            }

            var canvas = document.createElement('canvas');
            canvas.width = ancho;
            canvas.height = alto;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, ancho, alto);

            var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            var baseNombre = (file.name || "foto").replace(/\.[^/.]+$/, "");
            callback({
              filename: baseNombre + ".jpg",
              mimeType: "image/jpeg",
              data: dataUrl.split(',')[1]
            });
          };
          img.onerror = function() {
            var partes = String(e.target.result).split(',');
            callback({
              filename: file.name || "foto.jpg",
              mimeType: file.type || "image/jpeg",
              data: partes[1] || ""
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function enviarFoto() {
        var nombre = document.getElementById('nombreInput').value.trim();
        var input = document.getElementById('archivoInput');
        var status = document.getElementById('status');
        var btn = document.getElementById('subirBtn');

        if (!nombre || input.files.length === 0) {
          status.style.color = "#E91E63";
          status.innerText = "Por favor completa todos los campos.";
          return;
        }

        var file = input.files[0];
        status.style.color = "#0288D1";
        status.innerText = "Preparando y subiendo foto...";
        btn.disabled = true;

        prepararImagenParaEnvio(file, function(archivoListo) {
          var payload = {
            nombre: nombre,
            filename: archivoListo.filename,
            mimeType: archivoListo.mimeType,
            data: archivoListo.data
          };

          fetch(SCRIPT_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
          })
          .then(function(response) {
            return response.json();
          })
          .then(function(res) {
            btn.disabled = false;
            if (res && res.status === "success") {
              status.style.color = "#4CAF50";
              status.innerText = "¡Foto guardada! Actualizando muro...";
              setTimeout(function() {
                cambiarVista('muro');
                cargarDatos();
              }, 1500);
            } else {
              status.style.color = "#E91E63";
              status.innerText = "Error en servidor: " + (res && res.message ? res.message : "Respuesta inválida");
            }
          })
          .catch(function(err) {
            status.style.color = "#E91E63";
            status.innerText = "Error al subir la imagen: " + err.message;
            btn.disabled = false;
          });
        });
      }
    </script>
  </body>
</html>
